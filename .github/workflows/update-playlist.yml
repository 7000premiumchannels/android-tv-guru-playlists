name: Update Android TV Guru Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlists
        run: |
          python build_android_tv_guru_m3u-1.py

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AndroidTVGuru.m3u playlists/
          git diff --cached --quiet || git commit -m "Update Android TV Guru playlists"
          # Same class of race as update-epg.yml (see its comment): rebase
          # onto the latest main before pushing instead of failing on a
          # stale, non-fast-forward push.
          git pull --rebase origin main
          git push

name: Update Android TV Guru EPG

on:
  workflow_dispatch:
  push:
    # TEMPORARY, for post-merge production verification only — see the
    # matching note in update-playlist.yml. Remove once this run confirms
    # the rebase-before-push fix.
    branches:
      - main
  workflow_run:
    workflows: ["Update Android TV Guru Playlist"]
    types:
      - completed
  schedule:
    # Fallback in case the workflow_run trigger above doesn't fire (e.g. the
    # playlist workflow itself failed) - runs ~40 minutes after it.
    - cron: "57 9 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-epg:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh U.S. station data (Wikidata)
        run: python3 scripts/update_station_data.py

      - name: Match channels against legal EPG sources
        run: python3 scripts/build_epg_source.py

      - name: Clone iptv-org/epg grabber
        run: |
          git clone --filter=blob:none https://github.com/iptv-org/epg.git .epg-tool
          git -C .epg-tool checkout 1344395e9edb2967782dcda55b66fbc757db5caa

      - name: Install grabber dependencies
        working-directory: .epg-tool
        run: npm ci --no-audit --no-fund

      - name: Grab programme data for matched channels
        working-directory: .epg-tool
        run: |
          npx tsx scripts/commands/epg/grab.ts \
            --channels=../epg/grabber-input.channels.xml \
            --days=2 \
            --timeout=30000 \
            --delay=150 \
            --maxConnections=6 \
            --output=../epg/raw-guide.xml

      - name: Merge into AndroidTVGuru.xml(.gz)
        run: python3 scripts/merge_epg.py epg/raw-guide.xml --output .

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AndroidTVGuru.xml AndroidTVGuru.xml.gz epg/grabber-input.channels.xml \
                  reports/epg-matches.csv reports/epg-unmatched.csv reports/epg-conflicts.csv \
                  reports/epg-coverage.csv data/us_tv_stations.json
          git diff --cached --quiet || git commit -m "Update Android TV Guru EPG"
          # This job runs long (real grab + merge can take 40+ minutes), so
          # main may have moved since checkout (e.g. a manual push, or the
          # playlist workflow's own commit). Rebase onto the latest main
          # before pushing rather than failing on a stale, non-fast-forward
          # push — the two workflows never touch the same files (see
          # docs/ARCHITECTURE.md), so this rebase is conflict-free by
          # construction.
          git pull --rebase origin main
          git push
